<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- Orbital ring -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.5" transform="rotate(-30 50 50)"/>
  <!-- Arrow / send symbol -->
  <path d="M28 50 L50 28 L72 50 L58 50 L58 72 L42 72 L42 50 Z" fill="white" opacity="0.95"/>
  <!-- Star dot -->
  <circle cx="50" cy="28" r="3.5" fill="#a78bfa"/>
</svg>
